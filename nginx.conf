server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json;

    # never cache the dashboard shell, so updates land on a simple refresh
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # tiny endpoint for Kubernetes probes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
