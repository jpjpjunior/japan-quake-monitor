server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers.
    # NOTE: an add_header inside a location block REPLACES inherited add_headers,
    # so any location that sets one must repeat these. See /index.html and
    # /assets/ below. Verify with: curl -sI localhost:8080/index.html
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # script-src keeps 'unsafe-inline' because the whole app is one inline
    # <script>. Drop that token once index.html is split into app/*.js files.
    # media-src keeps 'data:' ONLY because the chime is still an inline base64
    # data URI; drop it once playChime() reads assets/eew-chime.mp3.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; media-src 'self' data:; connect-src 'self' wss://api.p2pquake.net https://api.p2pquake.net https://earthquake.usgs.gov; frame-ancestors 'none'; base-uri 'none'" always;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; media-src 'self' data:; connect-src 'self' wss://api.p2pquake.net https://api.p2pquake.net https://earthquake.usgs.gov; frame-ancestors 'none'; base-uri 'none'" always;
    }

    # the chime and any other binary assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # tiny endpoint for Kubernetes probes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
